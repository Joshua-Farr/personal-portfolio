[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback for React Router (login / admin / portal deep links)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Stripe webhooks should point at Firebase Functions directly (preferred):
#   https://us-central1.joshfarr-billing.cloudfunctions.net/stripeWebhook
# Optional Netlify proxy:
# [[redirects]]
#   from = "/api/webhooks/stripe"
#   to = "https://us-central1.joshfarr-billing.cloudfunctions.net/stripeWebhook"
#   status = 200
#   force = true
#
# Netlify Site → Environment variables (build-time VITE_* for SPA):
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN=joshfarr-billing.firebaseapp.com
#   VITE_FIREBASE_PROJECT_ID=joshfarr-billing
#   VITE_FIREBASE_STORAGE_BUCKET=joshfarr-billing.firebasestorage.app
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#   VITE_STRIPE_PUBLISHABLE_KEY=pk_test_…
# Values: see root .env.example. Never put sk_test_ / whsec_ / Resend in Netlify.
