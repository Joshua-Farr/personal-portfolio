[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback for React Router (login / admin / portal deep links)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Stripe webhooks should point at Firebase Functions directly (preferred):
#   https://us-central1.<BILLING_PROJECT>.cloudfunctions.net/stripeWebhook
# Optional Netlify proxy (only after billing project id is known):
# [[redirects]]
#   from = "/api/webhooks/stripe"
#   to = "https://us-central1.YOUR_BILLING_PROJECT.cloudfunctions.net/stripeWebhook"
#   status = 200
#   force = true
